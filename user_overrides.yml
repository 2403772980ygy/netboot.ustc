---

# overrides defaults in netbootxyz role
generate_menus: true
generate_disks: true
generate_checksums: true
generate_local_vars: true
make_num_jobs: 1

# set desired site name
# site_name: mysitename.com

# set desired boot domain
# boot_domain: boot.mysitename.com

# set boot version
# boot_version: "3.x"

# bootloader_tftp_enabled: false
# bootloader_https_enabled: true
# bootloader_http_enabled: true

# set release overrides from standard netboot.xyz defaults
release_overrides:
  archlinux:
    mirror: mirrors.ustc.edu.cn

# set utilitiesefi_overrides from standard netboot.xyz defaults for EFI utilities
# utilitiesefi_overrides:
#  supergrub:
#    enabled: false

# set utilities_overrides from standard netboot.xyz defaults for PC BIOS utilities
# utilitiespcbios64_overrides:
#  supergrub:
#    enabled: false

early_menu_enabled: false
early_menu_contents: |
   ### early menu overrides
   ### used to set early ipxe options such as custom console & logo
   # console --x 1024 --y 768
   # console --picture https://boot.netboot.xyz/logo.png

# Hack for mirroring endpoint content
upstream_endpoint: http://github.com/netbootxyz
live_endpoint: http://github.com/netbootxyz
endpoint_mirror_base_directory: endpoints/

# We may mirror partially, and use some hacks to make the boot scripts load the correct assets
endpoint_mirror_oss:
  # The following oss need little space to mirror, so we attempt these first
  - breakin
  - dban
  - devuan
  # The following oss are rather large, but very commonly seen so are mirrored
  - kali
  - oracle
  - gparted
  - bootrepair
  # The following have rather special scripts so I just mirror them
  - freebsd
  - shredos
  # The following have special scripts so you should NOT mirror them
  # - dts
  # The following is not currently available
  # - feren
